<div class="space-y-6 animate-fade-in">
    <!-- Header with Add Class Button -->
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold">Class Management</h2>
            <p class="text-sm text-muted-foreground">Create classes and assign teachers to subjects</p>
        </div>
        <button onclick="showAddClassModal()" class="px-4 py-2 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 flex items-center gap-2">
            <i data-lucide="plus" class="h-4 w-4"></i>
            Add New Class
        </button>
    </div>

    <!-- Classes List -->
    <div id="classes-list-container" class="space-y-4">
        <div class="text-center py-8 text-muted-foreground">Loading classes...</div>
    </div>
</div>

<!-- Add Class Modal -->
<div id="add-class-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeAddClassModal()"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md p-4">
        <div class="rounded-xl border bg-card p-6 shadow-xl animate-fade-in">
            <h3 class="text-lg font-semibold mb-4">Add New Class</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Class Name *</label>
                    <input type="text" id="modal-class-name" placeholder="e.g., Form 3A" class="w-full rounded-lg border border-input bg-background px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Grade/Level *</label>
                    <input type="text" id="modal-class-grade" placeholder="e.g., Form 3, Grade 10" class="w-full rounded-lg border border-input bg-background px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Stream (Optional)</label>
                    <input type="text" id="modal-class-stream" placeholder="e.g., A, Science, Arts" class="w-full rounded-lg border border-input bg-background px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Class Teacher</label>
                    <select id="modal-class-teacher" class="w-full rounded-lg border border-input bg-background px-3 py-2 text-sm">
                        <option value="">Select Class Teacher (Optional)</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeAddClassModal()" class="px-4 py-2 text-sm border rounded-lg hover:bg-accent">Cancel</button>
                <button onclick="handleAddClass()" class="px-4 py-2 text-sm bg-primary text-primary-foreground rounded-lg hover:bg-primary/90">Create Class</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Class Modal -->
<div id="edit-class-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeEditClassModal()"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md p-4">
        <div class="rounded-xl border bg-card p-6 shadow-xl animate-fade-in">
            <h3 class="text-lg font-semibold mb-4">Edit Class</h3>
            <input type="hidden" id="edit-class-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Class Name</label>
                    <input type="text" id="edit-class-name" class="w-full rounded-lg border border-input bg-background px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Grade/Level</label>
                    <input type="text" id="edit-class-grade" class="w-full rounded-lg border border-input bg-background px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Stream</label>
                    <input type="text" id="edit-class-stream" class="w-full rounded-lg border border-input bg-background px-3 py-2 text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeEditClassModal()" class="px-4 py-2 text-sm border rounded-lg hover:bg-accent">Cancel</button>
                <button onclick="saveClassChanges()" class="px-4 py-2 text-sm bg-primary text-primary-foreground rounded-lg hover:bg-primary/90">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<!-- Subject Assignment Modal -->
<div id="subject-assignment-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeSubjectAssignmentModal()"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl p-4">
        <div class="rounded-xl border bg-card p-6 shadow-xl animate-fade-in max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 sticky top-0 bg-card pt-2 z-10">
                <h3 class="text-lg font-semibold" id="subject-assignment-title">Assign Subject Teachers</h3>
                <button onclick="closeSubjectAssignmentModal()" class="p-2 hover:bg-accent rounded-lg">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>
            <div id="subject-assignment-content" class="space-y-4">
                <!-- Content loaded dynamically -->
            </div>
            <div class="flex justify-end gap-2 mt-6 pt-4 border-t">
                <button onclick="closeSubjectAssignmentModal()" class="px-4 py-2 text-sm border rounded-lg hover:bg-accent">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(() => {
        if (typeof refreshClassesList === 'function') refreshClassesList();
    }, 500);
});

function closeAddClassModal() {
    document.getElementById('add-class-modal').classList.add('hidden');
}

function closeEditClassModal() {
    document.getElementById('edit-class-modal').classList.add('hidden');
}

function closeSubjectAssignmentModal() {
    document.getElementById('subject-assignment-modal').classList.add('hidden');
}
</script>
